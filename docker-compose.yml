# OPGate + Redis 单机部署示例
#   docker compose up -d
services:
  ocgate:
    image: ghcr.io/ccbkkb/opgate:latest
    container_name: ocgate
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.yml:/etc/ocgate/config.yml:ro
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: ocgate-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
